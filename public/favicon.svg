<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8fab" />
      <stop offset="50%" stop-color="#c9184a" />
      <stop offset="100%" stop-color="#8e44ad" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe4ec" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Heart shape -->
  <path d="M32 58 C 12 42, 4 30, 4 20 C 4 10, 12 4, 20 4 C 26 4, 30 8, 32 12 C 34 8, 38 4, 44 4 C 52 4, 60 10, 60 20 C 60 30, 52 42, 32 58 Z"
        fill="url(#heartGrad)" filter="url(#glow)" />

  <!-- Bolt inside heart -->
  <path d="M34 14 L 22 34 L 30 34 L 26 50 L 42 30 L 34 30 Z"
        fill="url(#boltGrad)" />
</svg>